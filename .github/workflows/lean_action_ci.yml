name: Lean CI

# Verifica que los archivos .lean del repositorio compilan correctamente.
#
# Estrategia:
#   1. Instala elan directamente (sin lean-action, más robusto con RC toolchains)
#   2. Instala el toolchain exacto de lean-toolchain
#   3. Descarga cache de Mathlib (oleans precompilados)
#   4. Compila el proyecto con lake build
#
# Cache en capas:
#   - ~/.elan  (binarios de Lean/lake — ~200 MB, cambia poco)
#   - .lake    (dependencias del proyecto — ~6 GB, cambia con lake-manifest.json)
#
# Para correr localmente:
#   lake exe cache get   # descarga cache de Mathlib
#   lake build           # compila los archivos .lean del proyecto

on:
  push:
    paths:
      - '**/*.lean'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
  pull_request:
    paths:
      - '**/*.lean'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
  workflow_dispatch:

jobs:
  build:
    name: Verificar pruebas Lean 4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Leer versión del toolchain
        id: toolchain
        run: echo "version=$(cat lean-toolchain)" >> $GITHUB_OUTPUT

      - name: Instalar elan
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh | \
            sh -s -- --default-toolchain none --no-modify-path -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache de elan + toolchain Lean
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ steps.toolchain.outputs.version }}
          restore-keys: |
            elan-${{ runner.os }}-

      # `elan toolchain install` NO acepta flags: solo el nombre del toolchain.
      # Llevaba `--no-self-update`, que es de `rustup`, y elan lo rechazaba con
      # «Found argument '--no-self-update' which wasn't expected», tumbando el
      # CI en cada push. Comprobado contra elan 4.1.2: la ayuda del subcomando
      # lista `-h/--help` y nada mas.
      #
      # Tampoco hacia falta: elan no se autoactualiza al instalar un toolchain
      # —eso es comportamiento de rustup— asi que quitarlo no cambia nada.
      - name: Instalar toolchain Lean 4
        run: elan toolchain install ${{ steps.toolchain.outputs.version }}

      - name: Fijar toolchain activo
        run: elan override set ${{ steps.toolchain.outputs.version }}

      - name: Cache de dependencias lake (.lake/)
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles('lake-manifest.json') }}
          restore-keys: |
            lake-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-
            lake-${{ runner.os }}-

      - name: Descargar cache de Mathlib (oleans precompilados)
        run: lake exe cache get || echo "Cache parcial o no disponible — continuando"

      - name: Compilar proyecto
        run: lake build

      - name: Verificar archivos Lean del proyecto
        run: |
          echo "=== Archivos Lean verificados ==="
          find . -name "*.lean" -not -path "./.lake/*" | sort
          echo "==================================="
          echo "Build OK - $(find . -name '*.lean' -not -path './.lake/*' | wc -l) archivos"
