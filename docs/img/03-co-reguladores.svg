<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="Los cuatro co-reguladores en orden de prioridad de abajo hacia arriba: tactico en cada interaccion, organizacional cada 10 pasos, estrategico cada 100 pasos, integridad cada 50 pasos. Integridad es el unico que puede sobreescribir la clasificacion tactica, y solo con REPAIR_FRACTURE.">
<style>
  svg { color: #1f2328; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  text { fill: currentColor; }
  .lbl  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, sans-serif; font-weight: 500; }
  .dim  { opacity: .62; }
  .e-line { stroke: #5b4cc4; } .e-fill { fill: #5b4cc4; }
  .v-line { stroke: #0f766e; } .v-fill { fill: #0f766e; }
  .l-line { stroke: #a16207; } .l-fill { fill: #a16207; }
  .g-line { stroke: #b91c1c; } .g-fill { fill: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    svg { color: #c9d1d9; }
    .e-line { stroke: #a78bfa; } .e-fill { fill: #a78bfa; }
    .v-line { stroke: #2dd4bf; } .v-fill { fill: #2dd4bf; }
    .l-line { stroke: #fbbf24; } .l-fill { fill: #fbbf24; }
    .g-line { stroke: #f87171; } .g-fill { fill: #f87171; }
  }
</style>

  <defs>
    <marker id="pP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- priority ladder, row height 66, from y=40 (highest) to y=238 (lowest) -->
  <text x="20" y="24" font-size="11" class="dim">prioridad ↑</text>

  <!-- Integrity row (top) -->
  <rect x="80" y="34" width="360" height="56" rx="8" fill="none" class="v-line" stroke-width="1.8"/>
  <text x="96" y="56" class="lbl v-fill" font-size="13">CR_int · Integridad</text>
  <text x="96" y="74" font-size="10" class="dim">cada 50 pasos · verifica axiomas, conectividad, multiplicidad</text>
  <text x="460" y="66" font-size="10.5" class="v-fill">único que puede forzar REORGANIZE</text>

  <!-- Strategic -->
  <rect x="80" y="102" width="360" height="56" rx="8" fill="none" class="e-line" stroke-width="1.6"/>
  <text x="96" y="124" class="lbl e-fill" font-size="13">CR_str · Estratégico</text>
  <text x="96" y="142" font-size="10" class="dim">cada 100 pasos · une enlaces complejos → nueva capa jerárquica</text>

  <!-- Organizational -->
  <rect x="80" y="170" width="360" height="56" rx="8" fill="none" class="e-line" stroke-width="1.3" opacity="0.85"/>
  <text x="96" y="192" class="lbl e-fill" font-size="13">CR_org · Organizacional</text>
  <text x="96" y="210" font-size="10" class="dim">cada 10 pasos · vincula co-activaciones frecuentes, poda débiles</text>

  <!-- Tactical (bottom, lowest priority, but runs every time) -->
  <rect x="80" y="238" width="360" height="56" rx="8" fill="none" class="l-line" stroke-width="1.8"/>
  <text x="96" y="260" class="lbl l-fill" font-size="13">CR_tac · Táctico</text>
  <text x="96" y="278" font-size="10" class="dim">cada interacción · RESPONSE vs. ASSIST (memoria → heurística → GNN)</text>

  <!-- arrow: integrity can override tactical -->
  <path d="M 460 62 C 620 62, 620 260, 445 265" fill="none" class="v-line" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#pP)"/>
  <text x="630" y="160" font-size="10" class="v-fill" text-anchor="middle">solo con</text>
  <text x="630" y="174" font-size="10" class="v-fill" text-anchor="middle">REPAIR_FRACTURE</text>

  <!-- arbiter -->
  <rect x="560" y="238" width="260" height="56" rx="8" fill="none" stroke="currentColor" stroke-width="1.4" class="dim"/>
  <text x="690" y="260" text-anchor="middle" class="lbl" font-size="12.5">resolve_conflicts()</text>
  <text x="690" y="278" text-anchor="middle" font-size="9.5" class="dim">árbitro: gana la prioridad más alta activa</text>
</svg>