<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 190" role="img" aria-label="LeanClient intenta primero un subproceso local de lake env lean. Si el binario no esta disponible, cae a una peticion HTTP al servicio remoto lean_api desplegado en Railway, que corre el mismo comando dentro de su propio contenedor con Mathlib precompilado.">
<style>
  svg { color: #1f2328; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  text { fill: currentColor; }
  .lbl  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, sans-serif; font-weight: 500; }
  .dim  { opacity: .62; }
  .e-line { stroke: #5b4cc4; } .e-fill { fill: #5b4cc4; }
  .v-line { stroke: #0f766e; } .v-fill { fill: #0f766e; }
  .l-line { stroke: #a16207; } .l-fill { fill: #a16207; }
  .g-line { stroke: #b91c1c; } .g-fill { fill: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    svg { color: #c9d1d9; }
    .e-line { stroke: #a78bfa; } .e-fill { fill: #a78bfa; }
    .v-line { stroke: #2dd4bf; } .v-fill { fill: #2dd4bf; }
    .l-line { stroke: #fbbf24; } .l-fill { fill: #fbbf24; }
    .g-line { stroke: #f87171; } .g-fill { fill: #f87171; }
  }
</style>

  <defs>
    <marker id="pL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="30" y="70" width="180" height="60" rx="9" fill="none" class="v-line" stroke-width="1.6"/>
  <text x="120" y="94" text-anchor="middle" font-size="11.5" class="v-fill">LeanClient.check_code()</text>
  <text x="120" y="112" text-anchor="middle" font-size="9.5" class="dim">nucleo/lean/client.py</text>

  <line x1="210" y1="90" x2="290" y2="90" stroke="currentColor" stroke-width="1.4" marker-end="url(#pL)"/>
  <text x="215" y="82" font-size="9.5">1 · intenta local</text>

  <rect x="290" y="60" width="200" height="60" rx="9" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <text x="390" y="84" text-anchor="middle" font-size="11">subprocess lake env lean</text>
  <text x="390" y="100" text-anchor="middle" font-size="9.5" class="dim">--json · timeout 360s</text>

  <line x1="390" y1="120" x2="390" y2="150" stroke="currentColor" stroke-width="1.2" class="g-line" stroke-dasharray="4 3" marker-end="url(#pL)"/>
  <text x="400" y="140" font-size="9.5" class="g-fill">si NOT_AVAILABLE (sin lake)</text>

  <line x1="490" y1="90" x2="560" y2="90" stroke="currentColor" stroke-width="1.2" class="dim" stroke-dasharray="3 3"/>

  <rect x="560" y="60" width="230" height="70" rx="9" fill="none" class="l-line" stroke-width="1.5"/>
  <text x="675" y="84" text-anchor="middle" font-size="11" class="l-fill">lean_api (Railway)</text>
  <text x="675" y="100" text-anchor="middle" font-size="9.5" class="dim">POST /verify · mismo formato JSON</text>
  <text x="675" y="115" text-anchor="middle" font-size="9.5" class="dim">Mathlib precompilado en el contenedor</text>

  <line x1="390" y1="150" x2="675" y2="150" stroke="currentColor" stroke-width="1.2" class="g-line" marker-end="url(#pL)"/>
  <line x1="675" y1="150" x2="675" y2="130" stroke="currentColor" stroke-width="1.2" class="g-line"/>
</svg>