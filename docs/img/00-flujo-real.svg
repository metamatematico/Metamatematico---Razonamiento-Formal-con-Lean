<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="100%" role="img" aria-label="Flujo del sistema de la entrada a la salida. La consulta entra por un clasificador de forma que decide si es matemática; si no lo es va al LLM conversacional sin tocar Lean. Si lo es, el grafo categórico aporta tres cosas al prompt: las habilidades activadas con sus prerrequisitos, los nombres de Mathlib verificados con check, y ejemplos few-shot de LeanWorkbook. El LLM formaliza y produce código Lean candidato. Antes de verificar, el normalizador sustituye el import de Mathlib entero por los módulos que el grafo deriva de las habilidades activadas más una cabecera de tácticas. Lean verifica y su veredicto tiene seis salidas: verificado, sin teorema, refutación de lo preguntado, error de módulo que dispara la reparación de imports, error semántico que vuelve al LLM con máximo dos rondas, y sorry que va a la cascada de doce tácticas. Finalmente el LLM traduce y la respuesta sale con el veredicto delante del texto.">
<style>
  svg { color: #1f2328; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  text { fill: currentColor; }
  .lbl { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, sans-serif; font-weight: 600; }
  .dim { opacity: .6; }
  .g-line { stroke: #5b4cc4; } .g-fill { fill: #5b4cc4; }
  .v-line { stroke: #0f766e; } .v-fill { fill: #0f766e; }
  .l-line { stroke: #a16207; } .l-fill { fill: #a16207; }
  .r-line { stroke: #b91c1c; } .r-fill { fill: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    svg { color: #c9d1d9; }
    .g-line { stroke: #a78bfa; } .g-fill { fill: #a78bfa; }
    .v-line { stroke: #2dd4bf; } .v-fill { fill: #2dd4bf; }
    .l-line { stroke: #fbbf24; } .l-fill { fill: #fbbf24; }
    .r-line { stroke: #f87171; } .r-fill { fill: #f87171; }
  }
</style>
<defs>
  <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
  </marker>
</defs>

<text x="30" y="26" font-size="11" class="dim">DE LA ENTRADA A LA SALIDA — el grafo actúa en DOS puntos, marcados en violeta</text>

<rect x="30" y="48" width="150" height="46" rx="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="105" y="70" text-anchor="middle" class="lbl" font-size="12">consulta</text>
<text x="105" y="86" text-anchor="middle" font-size="9" class="dim">UI · CLI</text>

<rect x="215" y="48" width="205" height="46" rx="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="317" y="70" text-anchor="middle" class="lbl" font-size="12">¿es matemática?</text>
<text x="317" y="86" text-anchor="middle" font-size="9" class="dim">forma + vocabulario</text>

<rect x="470" y="42" width="215" height="58" rx="9" fill="none" class="l-line" stroke-width="1.5"/>
<text x="577" y="66" text-anchor="middle" class="lbl l-fill" font-size="12">LLM conversacional</text>
<text x="577" y="84" text-anchor="middle" font-size="9" class="dim">sin verificación formal</text>

<line x1="180" y1="71" x2="215" y2="71" stroke="currentColor" stroke-width="1.5" marker-end="url(#fl)"/>
<line x1="420" y1="71" x2="470" y2="71" class="l-line" stroke-width="1.5" marker-end="url(#fl)"/>
<text x="445" y="63" text-anchor="middle" font-size="10" class="l-fill">no</text>
<path d="M 317 100 L 317 128" class="v-line" stroke-width="1.8" marker-end="url(#fl)"/>
<text x="333" y="120" font-size="10" class="v-fill">sí</text>

<rect x="30" y="128" width="560" height="96" rx="11" fill="none" class="g-line" stroke-width="2.2"/>
<text x="48" y="152" class="lbl g-fill" font-size="12.5">1 · EL GRAFO PREPARA EL TERRENO</text>
<text x="48" y="176" font-size="10.5">habilidades activadas y sus prerrequisitos</text>
<text x="48" y="194" font-size="10.5">nombres de Mathlib <tspan class="g-fill">verificados con #check</tspan> — 95 % existen</text>
<text x="48" y="212" font-size="10.5">ejemplos few-shot de LeanWorkbook</text>

<rect x="640" y="128" width="215" height="96" rx="9" fill="none" class="l-line" stroke-width="1.8"/>
<text x="747" y="164" text-anchor="middle" class="lbl l-fill" font-size="12.5">2 · LLM formaliza</text>
<text x="747" y="184" text-anchor="middle" font-size="9.5" class="dim">escribe Lean 4</text>
<text x="747" y="202" text-anchor="middle" font-size="9.5" class="dim">no decide si es cierto</text>

<line x1="590" y1="176" x2="640" y2="176" class="g-line" stroke-width="1.8" marker-end="url(#fl)"/>
<path d="M 747 224 L 747 250 L 350 250 L 350 274" fill="none" class="l-line" stroke-width="1.6" marker-end="url(#fl)"/>

<rect x="30" y="274" width="560" height="76" rx="11" fill="none" class="g-line" stroke-width="2.2"/>
<text x="48" y="298" class="lbl g-fill" font-size="12.5">3 · EL GRAFO ELIGE QUÉ VE LEAN</text>
<text x="48" y="320" font-size="10.5">descarta <tspan font-family="ui-monospace">import Mathlib</tspan> (742 s, más que el timeout)</text>
<text x="48" y="338" font-size="10.5">y pone los <tspan class="g-fill">módulos de las habilidades activadas</tspan> + tácticas</text>

<rect x="640" y="274" width="215" height="76" rx="10" fill="none" class="v-line" stroke-width="2.6"/>
<text x="747" y="304" text-anchor="middle" class="lbl v-fill" font-size="14">4 · LEAN VERIFICA</text>
<text x="747" y="326" text-anchor="middle" font-size="10" class="v-fill">la fuente de verdad</text>

<line x1="590" y1="312" x2="640" y2="312" class="g-line" stroke-width="1.8" marker-end="url(#fl)"/>
<line x1="747" y1="350" x2="747" y2="376" class="v-line" stroke-width="1.8"/>
<line x1="150" y1="376" x2="1010" y2="376" class="v-line" stroke-width="1.4"/>

<rect x="30" y="400" width="240" height="52" rx="8" fill="none" class="v-line" stroke-width="1.6"/>
<text x="150" y="420" text-anchor="middle" font-size="10" class="v-fill">hay teorema y lo prueba</text>
<text x="150" y="440" text-anchor="middle" class="lbl" font-size="11.5">VERIFICADO</text>

<rect x="288" y="400" width="240" height="52" rx="8" fill="none" class="r-line" stroke-width="1.6"/>
<text x="408" y="420" text-anchor="middle" font-size="10" class="r-fill">Lean acepta, pero sin teorema</text>
<text x="408" y="440" text-anchor="middle" class="lbl" font-size="11.5">NO HAY PRUEBA</text>

<rect x="546" y="400" width="240" height="52" rx="8" fill="none" class="r-line" stroke-width="1.6"/>
<text x="666" y="420" text-anchor="middle" font-size="10" class="r-fill">verifica la NEGACIÓN</text>
<text x="666" y="440" text-anchor="middle" class="lbl" font-size="11.5">LO QUE PEDISTE ES FALSO</text>

<rect x="804" y="400" width="206" height="52" rx="8" fill="none" stroke="currentColor" stroke-width="1.4"/>
<text x="907" y="420" text-anchor="middle" font-size="10" class="dim">error de módulo · semántico</text>
<text x="907" y="440" text-anchor="middle" class="lbl" font-size="11.5">reparar y reintentar</text>

<line x1="150" y1="376" x2="150" y2="400" class="v-line" stroke-width="1.5" marker-end="url(#fl)"/>
<line x1="408" y1="376" x2="408" y2="400" class="r-line" stroke-width="1.5" marker-end="url(#fl)"/>
<line x1="666" y1="376" x2="666" y2="400" class="r-line" stroke-width="1.5" marker-end="url(#fl)"/>
<line x1="907" y1="376" x2="907" y2="400" stroke="currentColor" stroke-width="1.5" marker-end="url(#fl)"/>

<path d="M 1010 426 L 1055 426 L 1055 312 L 862 312" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#fl)"/>
<text x="1063" y="372" font-size="9" class="dim">imports · máx 2</text>
<text x="1063" y="386" font-size="9" class="dim">rondas · 12 tácticas</text>

<rect x="288" y="500" width="498" height="62" rx="10" fill="none" class="l-line" stroke-width="1.8"/>
<text x="537" y="524" text-anchor="middle" class="lbl l-fill" font-size="12.5">5 · LLM traduce el veredicto</text>
<text x="537" y="546" text-anchor="middle" font-size="9.5" class="dim">explica el código que Lean aceptó — no lo que el modelo creía</text>

<line x1="150" y1="452" x2="150" y2="531" class="v-line" stroke-width="1.5"/>
<line x1="150" y1="531" x2="288" y2="531" class="v-line" stroke-width="1.5" marker-end="url(#fl)"/>
<line x1="408" y1="452" x2="408" y2="500" class="r-line" stroke-width="1.5" marker-end="url(#fl)"/>
<line x1="666" y1="452" x2="666" y2="500" class="r-line" stroke-width="1.5" marker-end="url(#fl)"/>

<rect x="288" y="600" width="498" height="56" rx="10" fill="none" stroke="currentColor" stroke-width="1.8"/>
<text x="537" y="624" text-anchor="middle" class="lbl" font-size="12.5">respuesta</text>
<text x="537" y="644" text-anchor="middle" font-size="9.5" class="dim">el veredicto va DELANTE del texto, siempre</text>
<line x1="537" y1="562" x2="537" y2="600" stroke="currentColor" stroke-width="1.8" marker-end="url(#fl)"/>

<text x="30" y="686" font-size="9.5" class="dim">Los co-reguladores y la memoria MES no aparecen: deciden antes y registran después, pero no intervienen en formalizar ni en verificar.</text>
</svg>
