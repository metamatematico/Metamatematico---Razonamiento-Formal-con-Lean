<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="El flujo de la consulta a la respuesta. La consulta entra por la interfaz y un clasificador decide si es matematica; si no lo es va al modelo conversacional sin verificacion formal. Si lo es, el grafo actua en tres puntos numerados: prepara el prompt con nombres de Mathlib comprobados, elige que modulos importa Lean, y ordena las tacticas si queda un sorry. Cada punto lleva su veredicto medido: el primero y el tercero aportan, el segundo es inerte. Lean verifica en medio y su veredicto tiene seis salidas distintas." viewBox="0 0 1120 700">
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="pf"/></marker></defs>
<style>svg{color:#1b1e17}.bg{fill:#ffffff;stroke:#ddd6c2}.gr{fill:#e7e4f5;stroke:#564c9e}.ve{fill:#dbf0ea;stroke:#167a68}.ll{fill:#f5e7cf;stroke:#b4761f}.al{fill:#f6dfdc;stroke:#ae3b35}.ln{stroke:currentColor;opacity:.5;fill:none;stroke-width:1.6}.pf{fill:currentColor;opacity:.5}.t{font:13px ui-sans-serif,system-ui;fill:currentColor}.b{font:600 13px ui-sans-serif,system-ui;fill:currentColor}.s{font:11px ui-sans-serif,system-ui;fill:currentColor;opacity:.66}.m{font:11px ui-monospace,monospace;fill:currentColor;opacity:.72}.gt{fill:#564c9e}.vt{fill:#167a68}.lt{fill:#b4761f}.at{fill:#ae3b35}@media(prefers-color-scheme:dark){svg{color:#e8e6de}.bg{fill:#171b23;stroke:#2b3140}.gr{fill:#242038;stroke:#948bdd}.ve{fill:#152722;stroke:#4dc0aa}.ll{fill:#332714;stroke:#e2a94f}.al{fill:#331d1b;stroke:#e2827a}.gt{fill:#948bdd}.vt{fill:#4dc0aa}.lt{fill:#e2a94f}.at{fill:#e2827a}}rect{stroke-width:1.3}</style>
<text class="b" x="24" y="26" text-anchor="start">DE LA ENTRADA A LA SALIDA</text>
<text class="s" x="232" y="26" text-anchor="start">— el grafo actúa en TRES puntos, y sólo dos aportan</text>
<rect class="bg" x="24" y="46" width="150" height="46" rx="9"/>
<text class="b" x="99" y="68" text-anchor="middle">consulta</text>
<text class="s" x="99" y="84" text-anchor="middle">UI · CLI</text>
<rect class="bg" x="196" y="46" width="176" height="46" rx="9"/>
<text class="t" x="284" y="66" text-anchor="middle">¿es matemática?</text>
<text class="s" x="284" y="82" text-anchor="middle">forma + vocabulario</text>
<path class="ln" d="M174 69 L194 69" marker-end="url(#p)"/>
<rect class="ll" x="396" y="46" width="210" height="46" rx="9"/>
<text class="t" x="501" y="66" text-anchor="middle">LLM conversacional</text>
<text class="s" x="501" y="82" text-anchor="middle">sin verificación formal</text>
<path class="ln" d="M372 69 L394 69" marker-end="url(#p)"/>
<text class="s" x="383" y="62" text-anchor="middle">no</text>
<text class="s" x="290" y="108" text-anchor="middle">sí</text>
<path class="ln" d="M284 92 L284 122" marker-end="url(#p)"/>
<rect class="gr" x="24" y="126" width="582" height="74" rx="9"/>
<text class="b" x="40" y="148" text-anchor="start">1 · EL GRAFO PREPARA EL PROMPT</text>
<text class="s" x="40" y="168" text-anchor="start">conceptos activados · nombres de Mathlib comprobados con #check · ejemplos few-shot</text>
<text class="s" x="40" y="186" text-anchor="start">APORTA · 12× sobre el azar, medido contra ProofNet</text>
<circle cx="590" cy="140" r="5" class="gt"/>
<rect class="ll" x="24" y="214" width="582" height="56" rx="9"/>
<text class="b" x="40" y="236" text-anchor="start">2 · EL LLM FORMALIZA</text>
<text class="s" x="40" y="256" text-anchor="start">escribe Lean 4 — no decide si es cierto</text>
<path class="ln" d="M315 200 L315 212" marker-end="url(#p)"/>
<rect class="gr" x="24" y="284" width="582" height="74" rx="9"/>
<text class="b" x="40" y="306" text-anchor="start">3 · EL GRAFO ELIGE QUÉ MÓDULOS VE LEAN</text>
<text class="s" x="40" y="326" text-anchor="start">descarta `import Mathlib` — 742 s, más que el timeout</text>
<text class="s" x="40" y="344" text-anchor="start">INERTE · empata con un conjunto fijo de 3 módulos, y el margen total son 2,5 puntos</text>
<path class="ln" d="M315 270 L315 282" marker-end="url(#p)"/>
<rect class="ve" x="24" y="372" width="582" height="52" rx="9"/>
<text class="b" x="40" y="394" text-anchor="start">4 · LEAN VERIFICA</text>
<text class="s" x="40" y="412" text-anchor="start">la fuente de verdad · su veredicto es inapelable</text>
<path class="ln" d="M315 358 L315 370" marker-end="url(#p)"/>
<rect class="ve" x="24" y="442" width="182" height="30" rx="15"/>
<text class="m" x="115" y="462" text-anchor="middle">verificado</text>
<rect class="bg" x="220" y="442" width="182" height="30" rx="15"/>
<text class="m" x="311" y="462" text-anchor="middle">no hay prueba</text>
<rect class="bg" x="416" y="442" width="182" height="30" rx="15"/>
<text class="m" x="507" y="462" text-anchor="middle">lo pedido es falso</text>
<rect class="bg" x="24" y="482" width="182" height="30" rx="15"/>
<text class="m" x="115" y="502" text-anchor="middle">error de módulo</text>
<rect class="bg" x="220" y="482" width="182" height="30" rx="15"/>
<text class="m" x="311" y="502" text-anchor="middle">error semántico</text>
<rect class="al" x="416" y="482" width="182" height="30" rx="15"/>
<text class="m" x="507" y="502" text-anchor="middle">queda un `sorry`</text>
<path class="ln" d="M315 424 L315 440" marker-end="url(#p)"/>
<rect class="gr" x="24" y="534" width="582" height="74" rx="9"/>
<text class="b" x="40" y="556" text-anchor="start">5 · EL GRAFO ORDENA LAS TÁCTICAS</text>
<text class="s" x="40" y="576" text-anchor="start">12 tácticas · premisas sólo si el objetivo engancha con algo específico</text>
<text class="s" x="40" y="594" text-anchor="start">APORTA · 2,4× menos intentos, medido sobre 1600 pruebas de Mathlib</text>
<path class="ln" d="M115 512 L115 532" marker-end="url(#p)"/>
<rect class="ll" x="646" y="372" width="450" height="74" rx="9"/>
<text class="b" x="662" y="394" text-anchor="start">6 · EL LLM TRADUCE EL VEREDICTO</text>
<text class="s" x="662" y="414" text-anchor="start">explica el código que Lean aceptó —</text>
<text class="s" x="662" y="432" text-anchor="start">no lo que el modelo creía</text>
<path class="ln" d="M606 398 L644 398" marker-end="url(#p)"/>
<rect class="bg" x="646" y="470" width="450" height="66" rx="9"/>
<text class="b" x="871" y="496" text-anchor="middle">respuesta</text>
<text class="s" x="871" y="516" text-anchor="middle">el veredicto va DELANTE del texto, siempre</text>
<path class="ln" d="M871 446 L871 468" marker-end="url(#p)"/>
<rect class="bg" x="646" y="126" width="450" height="210" rx="9"/>
<text class="b" x="662" y="150" text-anchor="start">Lo que NO está en esta cadena</text>
<text class="s" x="662" y="174" text-anchor="start">Los co-reguladores deciden antes y la</text>
<text class="s" x="662" y="190" text-anchor="start">memoria MES registra después: ninguno</text>
<text class="s" x="662" y="206" text-anchor="start">formaliza ni verifica.</text>
<text class="s" x="662" y="236" text-anchor="start">La LISTA de 183 433 hechos de Mathlib</text>
<text class="s" x="662" y="252" text-anchor="start">no toca el prompt: alimenta el índice</text>
<text class="s" x="662" y="268" text-anchor="start">de premisas del paso 5.</text>
<text class="s" x="662" y="298" text-anchor="start">Los nombres de los 125 nodos generados</text>
<text class="s" x="662" y="314" text-anchor="start">no se inyectan: están deducidos, y 95</text>
<text class="s" x="662" y="330" text-anchor="start">de 447 no existen en Mathlib.</text>
</svg>