<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 800" role="img" aria-label="Diagrama de secuencia con seis participantes: Usuario, Nucleo, CoRegulatorNetwork, Grafo mas Memoria MES, LLM y Lean. Nucleo pide la decision a CoRegulatorNetwork, luego lee el grafo y la memoria para construir el contexto antes de pedirle al LLM que formalice, verifica con Lean, si hay sorry usa la cascada de solucionadores, pide al LLM traducir el resultado verificado, guarda la experiencia y evoluciona el grafo, y devuelve la respuesta al usuario.">
<style>
  svg { color: #1f2328; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  text { fill: currentColor; }
  .lbl  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, sans-serif; font-weight: 500; }
  .dim  { opacity: .62; }
  .e-line { stroke: #5b4cc4; } .e-fill { fill: #5b4cc4; }
  .v-line { stroke: #0f766e; } .v-fill { fill: #0f766e; }
  .l-line { stroke: #a16207; } .l-fill { fill: #a16207; }
  .g-line { stroke: #b91c1c; } .g-fill { fill: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    svg { color: #c9d1d9; }
    .e-line { stroke: #a78bfa; } .e-fill { fill: #a78bfa; }
    .v-line { stroke: #2dd4bf; } .v-fill { fill: #2dd4bf; }
    .l-line { stroke: #fbbf24; } .l-fill { fill: #fbbf24; }
    .g-line { stroke: #f87171; } .g-fill { fill: #f87171; }
  }
</style>

  <defs>
    <marker id="pS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <g class="dim" font-size="11.3">
    <text x="70" y="24" text-anchor="middle" class="lbl">Usuario</text>
    <text x="220" y="24" text-anchor="middle" class="lbl e-fill">Nucleo</text>
    <text x="380" y="24" text-anchor="middle" class="lbl e-fill">CoRegulatorNetwork</text>
    <text x="550" y="24" text-anchor="middle" class="lbl e-fill">Grafo + MES</text>
    <text x="740" y="24" text-anchor="middle" class="lbl l-fill">LLM</text>
    <text x="950" y="24" text-anchor="middle" class="lbl v-fill">Lean</text>
  </g>
  <line x1="70" y1="34" x2="70" y2="750" stroke="currentColor" stroke-width="1" class="dim"/>
  <line x1="220" y1="34" x2="220" y2="750" stroke="currentColor" stroke-width="1" class="dim"/>
  <line x1="380" y1="34" x2="380" y2="750" stroke="currentColor" stroke-width="1" class="dim"/>
  <line x1="550" y1="34" x2="550" y2="750" stroke="currentColor" stroke-width="1" class="dim"/>
  <line x1="740" y1="34" x2="740" y2="750" stroke="currentColor" stroke-width="1" class="dim"/>
  <line x1="950" y1="34" x2="950" y2="750" stroke="currentColor" stroke-width="1" class="dim"/>

  <line x1="70" y1="64" x2="220" y2="64" stroke="currentColor" stroke-width="1.5" marker-end="url(#pS)"/>
  <text x="80" y="56" font-size="10.3">1 · process("¿por qué √2 es irracional?")</text>

  <line x1="220" y1="110" x2="380" y2="110" class="e-line" stroke-width="1.5" marker-end="url(#pS)"/>
  <text x="228" y="102" font-size="10.3">2 · decide(texto, grafo)</text>

  <line x1="380" y1="156" x2="220" y2="156" class="e-line" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#pS)"/>
  <text x="228" y="148" font-size="10.3">3 · ActionType = ASSIST</text>

  <line x1="220" y1="202" x2="550" y2="202" class="e-line" stroke-width="1.6" marker-end="url(#pS)"/>
  <text x="228" y="194" font-size="10.3">4 · _find_relevant_context(query)</text>

  <line x1="550" y1="248" x2="220" y2="248" class="e-line" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#pS)"/>
  <text x="228" y="240" font-size="10.3">5 · contexto: habilidades, prerrequisitos, fórmulas ZFC…</text>

  <line x1="220" y1="294" x2="740" y2="294" class="l-line" stroke-width="1.5" marker-end="url(#pS)"/>
  <text x="228" y="286" font-size="10.3">6 · generate(formalizar, contexto del grafo)</text>
  <text x="228" y="316" font-size="9.3" class="dim">few-shot LeanWorkbook + anclas Mathlib verificadas</text>

  <line x1="740" y1="352" x2="220" y2="352" class="l-line" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#pS)"/>
  <text x="228" y="344" font-size="10.3">7 · código Lean candidato</text>

  <line x1="220" y1="398" x2="950" y2="398" class="v-line" stroke-width="1.8" marker-end="url(#pS)"/>
  <text x="228" y="390" font-size="10.3">8 · check_code(código)</text>

  <line x1="950" y1="444" x2="220" y2="444" class="v-line" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#pS)"/>
  <text x="228" y="436" font-size="10.3">9 · SUCCESS · SORRY · ERROR</text>
  <text x="228" y="458" font-size="9.3" class="dim">si ERROR semántico: el error de Lean vuelve al LLM (máx. 2 rondas)</text>

  <rect x="200" y="466" width="770" height="64" rx="8" fill="none" class="v-line" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="212" y="482" font-size="9.3" class="dim">alt · si el resultado es SORRY</text>
  <line x1="240" y1="506" x2="950" y2="506" class="v-line" stroke-width="1.3" marker-end="url(#pS)"/>
  <text x="248" y="500" font-size="9.8">9a · SolverCascade prueba 12 tácticas, ordenadas por el modelo entrenado</text>

  <line x1="220" y1="582" x2="740" y2="582" class="l-line" stroke-width="1.5" marker-end="url(#pS)"/>
  <text x="228" y="574" font-size="10.3">10 · generate(traducir resultado verificado)</text>

  <line x1="740" y1="628" x2="220" y2="628" class="l-line" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#pS)"/>
  <text x="228" y="620" font-size="10.3">11 · explicación fiel al código Lean real</text>

  <line x1="220" y1="674" x2="550" y2="674" class="e-line" stroke-width="1.6" marker-end="url(#pS)"/>
  <text x="228" y="666" font-size="10.3">12 · guarda ExperienceRecord + evoluciona el grafo (aprendizaje)</text>

  <line x1="220" y1="720" x2="70" y2="720" stroke="currentColor" stroke-width="1.6" marker-end="url(#pS)"/>
  <text x="80" y="712" font-size="10.3">13 · NucleoResponse + insignia de verificación</text>
</svg>