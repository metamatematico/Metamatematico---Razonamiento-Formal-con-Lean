<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" role="img" aria-label="Las tres capas de delgadez que hubo que abrir, de izquierda a derecha. Primera capa: Hom entre dos objetos era un booleano, o hay flecha o no la hay; ahora guarda varios morfismos distinguidos por su construccion, y cinco pares del grafo tienen mas de uno. Segunda capa: el runtime preguntaba si el apice era alcanzable desde cada componente, una pregunta sobre vertices; ahora exige exhibir una eleccion de flechas que conmute con los enlaces del patron, que es una pregunta sobre flechas. Tercera capa: conmutar solo tiene sentido respecto a que caminos se declaran iguales, asi que aparece una congruencia explicita, con una parte derivada del propio grafo y otra declarada a mano con su motivo matematico.">
<style>
  svg { color: #1f2328; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  text { fill: currentColor; }
  .lbl  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, sans-serif; font-weight: 500; }
  .dim  { opacity: .62; }
  .e-line { stroke: #5b4cc4; } .e-fill { fill: #5b4cc4; }
  .v-line { stroke: #0f766e; } .v-fill { fill: #0f766e; }
  .l-line { stroke: #a16207; } .l-fill { fill: #a16207; }
  .g-line { stroke: #b91c1c; } .g-fill { fill: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    svg { color: #c9d1d9; }
    .e-line { stroke: #a78bfa; } .e-fill { fill: #a78bfa; }
    .v-line { stroke: #2dd4bf; } .v-fill { fill: #2dd4bf; }
    .l-line { stroke: #fbbf24; } .l-fill { fill: #fbbf24; }
    .g-line { stroke: #f87171; } .g-fill { fill: #f87171; }
  }
</style>

  <defs>
    <marker id="d3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <text x="30" y="26" font-size="10.5" class="dim">TRES CAPAS DE DELGADEZ — hubo que abrir las tres</text>

  <rect x="30" y="48" width="300" height="180" rx="11" fill="none" class="e-line" stroke-width="1.7"/>
  <text x="50" y="76" class="lbl e-fill" font-size="12.5">1 · el objeto Hom</text>
  <text x="50" y="102" font-size="10" class="dim">antes: booleano</text>
  <text x="50" y="120" font-size="11">¿hay flecha de a a b?</text>
  <text x="50" y="148" font-size="10" class="e-fill">ahora: un conjunto</text>
  <text x="50" y="166" font-size="11">¿cuáles flechas, y en qué</text>
  <text x="50" y="182" font-size="11">se distinguen?</text>
  <text x="50" y="208" font-size="10" class="lbl e-fill">5 de 387 pares · NO delgado</text>

  <line x1="330" y1="138" x2="368" y2="138" stroke="currentColor" stroke-width="1.5" marker-end="url(#d3)"/>

  <rect x="368" y="48" width="300" height="180" rx="11" fill="none" class="v-line" stroke-width="1.7"/>
  <text x="388" y="76" class="lbl v-fill" font-size="12.5">2 · el test del colímite</text>
  <text x="388" y="102" font-size="10" class="dim">antes: sobre VÉRTICES</text>
  <text x="388" y="120" font-size="11">¿es el ápice alcanzable</text>
  <text x="388" y="136" font-size="11">desde cada componente?</text>
  <text x="388" y="164" font-size="10" class="v-fill">ahora: sobre FLECHAS</text>
  <text x="388" y="182" font-size="11">exhibe una elección que</text>
  <text x="388" y="198" font-size="11">conmute con los enlaces</text>
  <text x="388" y="218" font-size="10" class="lbl v-fill">find_colimit_cong</text>

  <line x1="668" y1="138" x2="706" y2="138" stroke="currentColor" stroke-width="1.5" marker-end="url(#d3)"/>

  <rect x="706" y="48" width="304" height="180" rx="11" fill="none" class="l-line" stroke-width="1.7"/>
  <text x="726" y="76" class="lbl l-fill" font-size="12.5">3 · qué es «conmutar»</text>
  <text x="726" y="102" font-size="10" class="dim">no tiene sentido absoluto:</text>
  <text x="726" y="120" font-size="11">hace falta decir qué caminos</text>
  <text x="726" y="136" font-size="11">son el mismo morfismo</text>
  <text x="726" y="164" font-size="10" class="l-fill">congruencia_declarada</text>
  <text x="726" y="182" font-size="10.5">2 derivadas del grafo</text>
  <text x="726" y="198" font-size="10.5">1 declarada con su motivo</text>
  <text x="726" y="218" font-size="10" class="dim">el cuadrado del pushout conmuta</text>

  <text x="30" y="262" font-size="10" class="dim">Cerrar solo la primera no basta: con Hom no delgado pero el test sobre vértices, la conmutación sigue sin comprobarse y los colímites falsos sobreviven.</text>
  <text x="30" y="280" font-size="10" class="dim">Medido: al cerrar la segunda cayeron 4 de los 31 colímites registrados — eran cotas superiores minimales sobre las que ninguna elección de flechas conmutaba.</text>
</svg>